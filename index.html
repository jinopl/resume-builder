<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f4e79" />
    <meta name="description" content="Free, private resume builder. Your data never leaves your browser." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4e79'/%3E%3Cpath d='M11.5 23.5V8.5h5.25a4.25 4.25 0 0 1 0 8.5H11.5M16.5 17l5 6.5' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Resume Builder</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      (function () {
        var dark = false;
        try {
          var p = localStorage.getItem('resume-builder:theme') || 'auto';
          dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
